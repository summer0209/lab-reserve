<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>教室预约</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 24px auto; }
        input, button, select { margin: 4px 0; padding: 6px; }
        section { border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #eee; padding: 6px; text-align: left; }
        .hide { display: none; }
    </style>
</head>
<body>
<h2>教室预约系统</h2>
<section id="loginBox">
    <h3>登录</h3>
    <input id="studentNo" placeholder="学号 / admin">
    <input id="password" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <p id="loginMsg"></p>
</section>
<div id="app" class="hide">
    <p>当前用户：<span id="who"></span> <button onclick="logout()">退出</button></p>
    <section>
        <h3>教室列表</h3>
        <button onclick="loadRooms()">刷新</button>
        <table>
            <thead><tr><th>ID</th><th>名称</th><th>楼栋</th><th>容量</th><th>设备</th><th>状态</th></tr></thead>
            <tbody id="roomTbody"></tbody>
        </table>
    </section>
    <section id="addRoomBox" class="hide">
        <h3>新增教室</h3>
        <input id="newName" placeholder="名称，如 A102">
        <input id="newBuilding" placeholder="楼栋">
        <input id="newCapacity" placeholder="容量" type="number">
        <input id="newEquipment" placeholder="设备">
        <button onclick="addRoom()">新增</button>
    </section>
    <section>
        <h3>预约教室</h3>
        <input id="roomId" placeholder="教室ID">
        <input id="reserveDate" type="date">
        <input id="startTime" type="time" value="08:00">
        <input id="endTime" type="time" value="10:00">
        <input id="purpose" placeholder="用途">
        <button onclick="book()">提交预约</button>
    </section>
    <section>
        <h3>我的预约</h3>
        <button onclick="loadMine()">刷新</button>
        <table>
            <thead><tr><th>ID</th><th>教室</th><th>日期</th><th>时段</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="mineTbody"></tbody>
        </table>
    </section>
    <section id="adminBox" class="hide">
        <h3>管理员审核</h3>
        <button onclick="loadPending()">刷新待审核</button>
        <table>
            <thead><tr><th>ID</th><th>学生</th><th>教室</th><th>日期</th><th>时段</th><th>操作</th></tr></thead>
            <tbody id="pendingTbody"></tbody>
        </table>
    </section>
</div>
<script>
    const API = "http://localhost:8080/api";
    let me = null;
    async function req(url, opt) {
      const res = await fetch(API + url, Object.assign({
        headers: { "Content-Type": "application/json" }
      }, opt));
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = { message: text }; }
      if (!res.ok) throw new Error((data && data.message) || res.status);
      return data;
    }
    async function login() {
      try {
        me = await req("/auth/login", {
          method: "POST",
          body: JSON.stringify({ studentNo: studentNo.value, password: password.value })
        });
        localStorage.setItem("me", JSON.stringify(me));
        showApp();
      } catch (e) { loginMsg.textContent = e.message; }
    }
    function logout() { me = null; localStorage.removeItem("me"); location.reload(); }
    function showApp() {
      loginBox.classList.add("hide");
      app.classList.remove("hide");
      who.textContent = me.name + " (" + me.role + ", id=" + me.id + ")";
      if (me.role === "ADMIN") {
        adminBox.classList.remove("hide");
        addRoomBox.classList.remove("hide");
        loadPending();
      }
      loadRooms();
      loadMine();
    }
    async function loadRooms() {
      const list = await req("/rooms");
      roomTbody.innerHTML = list.map(r =>
        `<tr><td>${r.id}</td><td>${r.name}</td><td>${r.building}</td><td>${r.capacity}</td><td>${r.equipment || ""}</td><td>${r.status}</td></tr>`
      ).join("");
    }
    async function addRoom() {
      try {
        await req("/rooms", {
          method: "POST",
          body: JSON.stringify({
            name: newName.value,
            building: newBuilding.value,
            capacity: Number(newCapacity.value),
            equipment: newEquipment.value
          })
        });
        loadRooms();
      } catch (e) { alert(e.message); }
    }
    async function book() {
      try {
        const r = await req("/reservations", {
          method: "POST",
          body: JSON.stringify({
            userId: String(me.id),
            roomId: roomId.value,
            reserveDate: reserveDate.value,
            startTime: startTime.value,
            endTime: endTime.value,
            purpose: purpose.value
          })
        });
        alert("提交成功，状态：" + r.status);
        loadMine();
      } catch (e) { alert(e.message); }
    }
    async function loadMine() {
      const list = await req("/reservations/me?userId=" + me.id);
      mineTbody.innerHTML = list.map(r =>
        `<tr><td>${r.id}</td><td>${r.room.name}</td><td>${r.reserveDate}</td><td>${r.startTime}-${r.endTime}</td><td>${r.status}</td><td>${r.status !== "CANCELLED" && r.status !== "REJECTED" ? `<button onclick="cancel(${r.id})">取消</button>` : ""}</td></tr>`
      ).join("");
    }
    async function cancel(id) {
      try {
        await req("/reservations/" + id + "/cancel?userId=" + me.id, { method: "POST" });
        loadMine();
      } catch (e) { alert(e.message); }
    }
    async function loadPending() {
      const list = await req("/reservations/pending");
      pendingTbody.innerHTML = list.map(r =>
        `<tr><td>${r.id}</td><td>${r.user.name}</td><td>${r.room.name}</td><td>${r.reserveDate}</td><td>${r.startTime}-${r.endTime}</td><td><button onclick="review(${r.id},'approve')">通过</button> <button onclick="review(${r.id},'reject')">拒绝</button></td></tr>`
      ).join("");
    }
    async function review(id, action) {
      try {
        await req("/reservations/" + id + "/" + action + "?adminId=" + me.id, { method: "POST" });
        loadPending();
        loadMine();
      } catch (e) { alert(e.message); }
    }
    const saved = localStorage.getItem("me");
    if (saved) { me = JSON.parse(saved); showApp(); }
</script>
</body>
</html>
